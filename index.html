<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1562690868-60bbe7293e94');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100%;
            filter: brightness(0.9);
        }
        
        .welcome-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }
        
        h1 {
            color: white;
            font-size: 5em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            margin: 0 0 30px 0; /* Added bottom margin */
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            display: inline-block;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1.2em;
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: rgba(255, 255, 255, 1);
        }
        
        /* For mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
                margin-bottom: 20px; /* Adjusted for mobile */
            }
            
            button {
                padding: 10px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="welcome-container">
            <h1>Welcome</h1>
            
        
            <a href="second.html" style="display: inline-block; margin-top: 20px; text-decoration: none; color: white; font-size: 1.2em;">click here sukoon</a>
        
    </div>
    
</body>
</html>
